# Baseline experiment: cross-architecture generator OOD.
# Use fixed manifests on the command line for reproducible ablations.

data:
  root_dir: "/workspace/data/processed"
  train_manifest: "src/data/cross_architecture_train_manifest.csv"
  test_manifest: "src/data/cross_architecture_test_manifest.csv"
  full_test_manifest: "src/data/cross_architecture_full_test_manifest.csv"
  datasets:
    - name: "cnndetection"
      metadata: "cnndetection/cnndetection_metadata.csv"
      architecture_type: "gan"
    - name: "synthbuster"
      metadata: "synthbuster/synthbuster_metadata.csv"
      architecture_type: "diffusion"

  image_size: 256
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

  split:
    level: "model"
    experiment_name: "cross_architecture"
    exclude_families: ["cnn", "implicit_generative", "face_manipulation"]
    real_strategy: "dataset_stratified"
    real_test_fraction: 0.53385

  train_models:
    gan:
      - "progan"
      - "biggan"
      - "cyclegan"
      - "stargan"
    diffusion:
      - "dalle2"
      - "glide"
      - "midjourney"
      - "sd_13"
      - "sd_14"
      - "sd_2"

  test_models:
    gan:
      - "stylegan"
      - "stylegan2"
      - "gaugan"
      - "whichfaceisreal"
    diffusion:
      - "dalle3"
      - "firefly"
      - "sd_xl"

  balance_classes: true
  samples_per_class: null
  val_split: 0.1
  weighted_sampling: true
  augmentation:
    transforms:
      flip:
        enabled: true
        p: 0.5
      rotate:
        enabled: true
        p: 0.3
      color:
        enabled: true
        p: 0.4
        factor: 0.2
      blur:
        enabled: true
        p: 0.3
        sigma_range: [0.3, 2.0]
      jpeg:
        enabled: true
        p: 0.5
        quality_range: [45, 95]
      resize_artifact:
        enabled: true
        p: 0.5
        scale_range: [0.45, 0.9]
      noise:
        enabled: false
        p: 0.0
        std_range: [1.0, 6.0]

  batch_size: 32
  num_workers: 8
  pin_memory: true

model:
  domains:
    use_rgb: true
    use_freq: true
    use_noise: true

  rgb_branch:
    model_name: "microsoft/swin-tiny-patch4-window7-224"
    pretrained: true
    feature_dim: 512

  frequency_branch:
    input_channels: 1
    feature_dim: 256
    resnet_type: "resnet18"
    pretrained: true

  noise_branch:
    num_srm_filters: 3
    feature_dim: 256
    resnet_type: "resnet18"
    pretrained: true

  fusion:
    type: "attention"
    hidden_dim: 512
    num_heads: 8
    dropout: 0.3

  dil:
    use_dil: true

  normalization:
    use_norm_a: true
    use_norm_b: true

  ood:
    use_adapters: false
    adapter_bottleneck_dim: 128

  classifier:
    hidden_dims: [256, 128]
    dropout: 0.5
    num_classes: 2

training:
  epochs: 50
  learning_rate: 1e-4
  weight_decay: 1e-5
  optimizer: "adamw"
  betas: [0.9, 0.999]
  scheduler: "cosine"
  warmup_epochs: 5
  min_lr: 1e-6
  use_amp: true
  gradient_clip: 1.0
  accumulation_steps: 1
  early_stopping:
    patience: 10
    min_delta: 0.001
    monitor: "val_auc"
  checkpoint_dir: "./checkpoints/ablation/baseline"
  save_best_only: true
  save_freq: 5
  decision_threshold: 0.5
  tune_threshold: false
  threshold_metric: "balanced_accuracy"

evaluation:
  metrics:
    - "accuracy"
    - "auc"
    - "precision"
    - "recall"
    - "f1"
  per_architecture: true
  generate_confusion_matrix: true
  generate_roc_curve: true

logging:
  level: "INFO"
  tensorboard_dir: "./runs/ablation/baseline"
  log_freq: 100

seed: 42
device: "cuda"
